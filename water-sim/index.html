<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Three.js Water — 512×512 Wave Simulation</title>
<style>
  :root{
    --panel: rgba(10,16,26,0.72);
    --line: rgba(255,255,255,0.08);
    --text:#cfe0ee; --dim:#7f93a6; --accent:#4fb6ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#060a12;
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color:var(--text); }
  canvas{ display:block; }

  #ui{ position:fixed; top:14px; left:14px; width:256px; background:var(--panel);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border:1px solid var(--line); border-radius:14px; padding:14px 14px 12px;
    box-shadow:0 10px 40px rgba(0,0,0,.5); user-select:none; }
  #ui h1{ font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin:0 0 2px; font-weight:600; }
  #ui .sub{ font-size:11px; color:var(--dim); margin-bottom:12px; }

  .row{ display:flex; align-items:center; justify-content:space-between; margin:9px 0; gap:10px; }
  .row label{ font-size:11.5px; color:var(--text); flex:0 0 90px; }
  .row input[type=range]{ flex:1; accent-color:var(--accent); height:3px; cursor:pointer; }
  .row .val{ flex:0 0 40px; text-align:right; font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }

  .toggles{ display:flex; gap:16px; margin:12px 0 2px; }
  .toggles label{ font-size:11.5px; display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--text); }
  .toggles input{ accent-color:var(--accent); }

  .btns{ display:flex; gap:8px; margin-top:10px; }
  .btns button{ flex:1; font:inherit; font-size:11.5px; padding:7px 0; border-radius:8px;
    border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--text); cursor:pointer; }
  .btns button:hover{ background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.22); }

  #hud{ position:fixed; top:14px; right:14px; text-align:right; font-size:11px; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); line-height:1.6; }
  #hud b{ color:var(--text); }

  #help{ position:fixed; bottom:14px; left:14px; font-size:11.5px; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #help b{ color:var(--accent); font-weight:600; }

  #err{ position:fixed; inset:0; display:none; place-items:center; color:#ff8f8f; font-size:14px;
    background:#0a0d13; z-index:10; text-align:center; padding:24px; }
</style>
</head>
<body>
  <div id="err"></div>

  <div id="ui">
    <h1>Water · 512×512</h1>
    <div class="sub">2D wave equation · GPU ping-pong FBO</div>
    <div id="sliders"></div>
    <div class="toggles">
      <label><input id="anim" type="checkbox" checked> Animate sun</label>
      <label><input id="rain" type="checkbox"> Rain</label>
    </div>
    <div class="btns">
      <button id="calm">Calm</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  <div id="hud"><b id="fps">–</b> fps · <span id="gl">…</span><br>grid 512×512</div>
  <div id="help"><b>Click / drag</b> ripples  ·  <b>Right-drag</b> orbit  ·  <b>Scroll</b> zoom</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const SEGMENTS = 512;      // 512x512 subdivisions (requirement)
const SIM      = SEGMENTS + 1;   // 513x513 heightfield grid, 1:1 with vertices
const PLANE_SIZE = 12;
const CLICKS   = 8;

const DEFAULTS = {
  speed: 0.40,  // wave c^2 coefficient (stable < 0.5)
  damp:  0.996, // velocity damping per step
  amp:   0.60,  // world units per sim height unit
  rip:   1.00,  // click impulse strength
  rad:   5,     // ripple gaussian radius (texels)
  el:    0.70,  // sun elevation (rad)
  az:    45,    // sun azimuth (deg)
  li:    1.00,  // light intensity
  anim:  true,
  rain:  false,
};
const params = { ...DEFAULTS };
let sunTheta = THREE.MathUtils.degToRad(params.az);

function fatal(msg){
  const e = document.getElementById('err');
  e.style.display = 'grid';
  e.textContent = msg;
}

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch (e) {
  fatal('WebGL is not available in this browser: ' + e.message);
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060a12, 1);
document.body.appendChild(renderer.domElement);

const gl = renderer.getContext();
const isGL2 = renderer.capabilities.isWebGL2;
document.getElementById('gl').textContent = (isGL2 ? 'WebGL2' : 'WebGL1') +
  (renderer.capabilities.maxVertexUniforms >= 128 ? '' : ' !');
if (!isGL2) console.warn('Running on WebGL1; half-float linear filtering may be limited.');

// ---------------------------------------------------------------------------
// Scene + camera
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x060a12, 20, 70);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 300);
let camTheta = 0.7, camPhi = 0.85, camRadius = 17;
function updateCamera(){
  camera.position.set(
    camRadius * Math.sin(camPhi) * Math.cos(camTheta),
    camRadius * Math.cos(camPhi),
    camRadius * Math.sin(camPhi) * Math.sin(camTheta)
  );
  camera.lookAt(0, 0, 0);
}
updateCamera();

// ---------------------------------------------------------------------------
// Wave simulation — ping-pong float FBOs (height in R, velocity in G)
// ---------------------------------------------------------------------------
const rtOpts = {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.ClampToEdgeWrapping,
  wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false, stencilBuffer: false, generateMipmaps: false,
};
const rt0 = new THREE.WebGLRenderTarget(SIM, SIM, rtOpts);
const rt1 = new THREE.WebGLRenderTarget(SIM, SIM, rtOpts);
let readRT = rt0, writeRT = rt1;

const clickUniforms = [];
for (let i = 0; i < CLICKS; i++) clickUniforms.push(new THREE.Vector4(0, 0, 0, 0));

const simMat = new THREE.ShaderMaterial({
  uniforms: {
    tState:  { value: null },
    uParams: { value: new THREE.Vector3(params.speed, params.damp, 1.0) }, // c2, damping, dt
    uSize:   { value: new THREE.Vector2(SIM, SIM) },
    uClicks: { value: clickUniforms },
    uRadius: { value: params.rad },
    uEdge:   { value: 0.96 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D tState;
    uniform vec3 uParams;     // x: c2, y: damping, z: dt
    uniform vec2 uSize;
    uniform vec4 uClicks[${CLICKS}];  // gx, gy, strength, active
    uniform float uRadius;
    uniform float uEdge;

    void main(){
      vec2 tex = 1.0 / uSize;
      vec4 s = texture2D(tState, vUv);
      float h = s.r;
      float v = s.g;

      // 5-point Laplacian of height
      float hL = texture2D(tState, vUv - vec2(tex.x, 0.0)).r;
      float hR = texture2D(tState, vUv + vec2(tex.x, 0.0)).r;
      float hD = texture2D(tState, vUv - vec2(0.0, tex.y)).r;
      float hU = texture2D(tState, vUv + vec2(0.0, tex.y)).r;
      float lap = hL + hR + hU + hD - 4.0 * h;

      // explicit wave update (semi-implicit, damped)
      v = (v + uParams.x * lap * uParams.z) * uParams.y;
      h = h + v * uParams.z;

      // point impulses (downward velocity gaussians) -> ripples
      vec2 gp = vUv * uSize;
      for (int i = 0; i < ${CLICKS}; i++){
        if (uClicks[i].w > 0.5){
          float d = distance(gp, uClicks[i].xy);
          v += -uClicks[i].z * exp(-(d * d) / (2.0 * uRadius * uRadius));
        }
      }

      // open-boundary edge absorption so ripples fade instead of bouncing forever
      vec2 edge = min(vUv, 1.0 - vUv) * uSize;
      float keep = mix(uEdge, 1.0, smoothstep(0.0, 8.0, min(edge.x, edge.y)));
      h *= keep;
      v *= keep;

      gl_FragColor = vec4(h, v, 0.0, 1.0);
    }
  `,
});
const simScene = new THREE.Scene();
const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -1, 1);
const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat);
simQuad.frustumCulled = false;
simScene.add(simQuad);

// clear helper
const clearMat = new THREE.ShaderMaterial({
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: 'void main(){ gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }'
});
const clearScene = new THREE.Scene();
const clearQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), clearMat);
clearQuad.frustumCulled = false;
clearScene.add(clearQuad);
function clearSim(){
  renderer.setRenderTarget(rt0); renderer.render(clearScene, simCam);
  renderer.setRenderTarget(rt1); renderer.render(clearScene, simCam);
  renderer.setRenderTarget(null);
  readRT = rt0; writeRT = rt1;
}

// ---------------------------------------------------------------------------
// Water surface mesh — 512x512 subdivisions, displaced + lit in shaders
// ---------------------------------------------------------------------------
const waterGeo = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, SEGMENTS, SEGMENTS);
const cell = PLANE_SIZE / SIM;

const waterMat = new THREE.ShaderMaterial({
  uniforms: {
    uHeight:       { value: null },
    uHeightScale:  { value: params.amp },
    uSim:          { value: new THREE.Vector2(SIM, SIM) },
    uCell:         { value: cell },
    uLightDir:     { value: new THREE.Vector3(0, 1, 0) },
    uLightColor:   { value: new THREE.Color(0xfff1d6) },
    uLightIntensity:{ value: params.li },
    uDeepColor:    { value: new THREE.Color(0x001826) },
    uShallowColor: { value: new THREE.Color(0x0e4a63) },
    uSkyColor:     { value: new THREE.Color(0x2f6398) },
    uHorizonColor: { value: new THREE.Color(0x9fb6cc) },
    uSpecular:     { value: 1.2 },
    uShininess:    { value: 160.0 },
    uFresnel:      { value: 3.0 },
    uFogColor:     { value: new THREE.Color(0x060a12) },
    uFogNear:      { value: 20.0 },
    uFogFar:       { value: 70.0 },
  },
  vertexShader: `
    precision highp float;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vHeight;
    uniform sampler2D uHeight;
    uniform float uHeightScale;
    uniform vec2 uSim;
    uniform float uCell;
    void main(){
      // map each vertex to its heightfield texel center
      vec2 ts = (uv * (uSim - 1.0) + 0.5) / uSim;
      vec2 st = 1.0 / uSim;
      float h  = texture2D(uHeight, ts).r;
      float hL = texture2D(uHeight, ts - vec2(st.x, 0.0)).r;
      float hR = texture2D(uHeight, ts + vec2(st.x, 0.0)).r;
      float hD = texture2D(uHeight, ts - vec2(0.0, st.y)).r;
      float hU = texture2D(uHeight, ts + vec2(0.0, st.y)).r;

      vec3 displaced = position + normal * (h * uHeightScale);
      vec4 wp = modelMatrix * vec4(displaced, 1.0);
      vWorldPos = wp.xyz;
      vHeight = h;

      // finite-difference normal (world space)
      float dhdx = (hR - hL) * uHeightScale / (2.0 * uCell);
      float dhdy = (hU - hD) * uHeightScale / (2.0 * uCell);
      vec3 nLocal = normalize(vec3(-dhdx, -dhdy, 1.0));
      vNormal = normalize(mat3(modelMatrix) * nLocal);

      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vHeight;
    uniform vec3 uLightDir;
    uniform vec3 uLightColor;
    uniform float uLightIntensity;
    uniform vec3 uDeepColor;
    uniform vec3 uShallowColor;
    uniform vec3 uSkyColor;
    uniform vec3 uHorizonColor;
    uniform float uSpecular;
    uniform float uShininess;
    uniform float uFresnel;
    uniform vec3 uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;
    void main(){
      vec3 N = normalize(vNormal);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(cameraPosition - vWorldPos);
      vec3 L = normalize(uLightDir);
      vec3 H = normalize(L + V);

      float ndl  = max(dot(N, L), 0.0);
      float spec = pow(max(dot(N, H), 0.0), uShininess) * uSpecular;
      float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), uFresnel);

      // crest = shallower = lighter
      float depthCue = clamp(0.5 + 0.4 * vHeight, 0.0, 1.0);
      vec3 base = mix(uDeepColor, uShallowColor, depthCue);

      // sky reflection with a sun glint
      vec3 R = reflect(-V, N);
      vec3 sky = mix(uHorizonColor, uSkyColor, clamp(R.y * 0.85 + 0.15, 0.0, 1.0));
      sky += uLightColor * pow(max(dot(R, L), 0.0), 800.0) * 1.5;

      vec3 col = base * (0.14 + 0.86 * ndl) * uLightIntensity; // ambient + diffuse
      col = mix(col, sky, fres * 0.9);                          // fresnel reflection
      col += spec * uLightColor * uLightIntensity;              // sun specular

      float fogF = smoothstep(uFogNear, uFogFar, distance(cameraPosition, vWorldPos));
      col = mix(col, uFogColor, fogF);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide,
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI / 2;   // horizontal, normal up (+Y)
water.frustumCulled = false;
scene.add(water);

// ---------------------------------------------------------------------------
// Interaction: pointer -> grid coords
// ---------------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const _ndc = new THREE.Vector2(), _pt = new THREE.Vector3();
const pointer = { grid: null };
let wantRipple = false, orbiting = false, lastX = 0, lastY = 0;

function pick(e){
  _ndc.x =  (e.clientX / innerWidth) * 2 - 1;
  _ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(_ndc, camera);
  if (!raycaster.ray.intersectPlane(groundPlane, _pt)) return null;
  const uvx = 0.5 + _pt.x / PLANE_SIZE;
  const uvy = 0.5 - _pt.z / PLANE_SIZE;
  if (uvx < 0 || uvx > 1 || uvy < 0 || uvy > 1) return null;
  return { x: uvx * SIM, y: uvy * SIM };
}

const canvas = renderer.domElement;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (e.button === 0){
    pointer.grid = pick(e); wantRipple = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  } else if (e.button === 2){
    orbiting = true; lastX = e.clientX; lastY = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  }
});
window.addEventListener('pointermove', e => {
  if (e.buttons & 1){ pointer.grid = pick(e); wantRipple = true; }
  if (orbiting && (e.buttons & 2)){
    camTheta -= (e.clientX - lastX) * 0.005;
    camPhi = THREE.MathUtils.clamp(camPhi - (e.clientY - lastY) * 0.005, 0.12, 1.5);
    lastX = e.clientX; lastY = e.clientY;
    updateCamera();
  }
});
window.addEventListener('pointerup', e => { if (e.button === 2) orbiting = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camRadius = THREE.MathUtils.clamp(camRadius * (1 + Math.sign(e.deltaY) * 0.1), 6, 45);
  updateCamera();
}, { passive:false });

// ---------------------------------------------------------------------------
// Control panel (hand-rolled, no external UI lib)
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const sliderCfg = [
  { key:'speed', label:'Wave speed',  min:0.05, max:0.5,  step:0.005, fmt:v=>v.toFixed(2) },
  { key:'damp',  label:'Damping',     min:0.98, max:1.0,  step:0.0005, fmt:v=>v.toFixed(4) },
  { key:'amp',   label:'Amplitude',   min:0.0,  max:1.5,  step:0.02, fmt:v=>v.toFixed(2) },
  { key:'rip',   label:'Ripple power',min:0.1,  max:3,    step:0.05, fmt:v=>v.toFixed(2) },
  { key:'rad',   label:'Ripple size', min:1,    max:16,   step:1,    fmt:v=>v.toFixed(0) },
  { key:'el',    label:'Sun height',  min:0.05, max:1.5,  step:0.01, fmt:v=>v.toFixed(2) },
  { key:'az',    label:'Sun angle',   min:0,    max:360,  step:1,    fmt:v=>v.toFixed(0)+'°' },
  { key:'li',    label:'Light',       min:0.2,  max:2,    step:0.05, fmt:v=>v.toFixed(2) },
];
const sliders = {};
const sliderBox = $('sliders');
for (const c of sliderCfg){
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = c.label;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = params[c.key];
  const val = document.createElement('span'); val.className = 'val';
  const upd = () => { val.textContent = c.fmt(parseFloat(inp.value)); };
  inp.addEventListener('input', () => {
    params[c.key] = parseFloat(inp.value);
    if (c.key === 'az') sunTheta = THREE.MathUtils.degToRad(params.az);
    upd();
  });
  row.append(lab, inp, val); sliderBox.appendChild(row);
  sliders[c.key] = { inp, val, upd };
  upd();
}
function refreshLabels(){ for (const c of sliderCfg){ sliders[c.key].upd(); } }

const animEl = $('anim'), rainEl = $('rain');
animEl.addEventListener('change', () => params.anim = animEl.checked);
rainEl.addEventListener('change', () => params.rain = rainEl.checked);
$('calm').addEventListener('click', clearSim);
$('reset').addEventListener('click', () => {
  Object.assign(params, DEFAULTS);
  sunTheta = THREE.MathUtils.degToRad(params.az);
  for (const c of sliderCfg) sliders[c.key].inp.value = params[c.key];
  animEl.checked = params.anim; rainEl.checked = params.rain;
  refreshLabels();
  clearSim();
});

// ---------------------------------------------------------------------------
// Impulse scheduling
// ---------------------------------------------------------------------------
const pending = [];
function splash(x, y, s){ pending.push({ x, y, s }); }
function prepareClicks(){
  const arr = clickUniforms;
  for (let i = 0; i < CLICKS; i++) arr[i].set(0, 0, 0, 0);
  let ci = 0;
  if (wantRipple && pointer.grid){
    arr[ci].set(pointer.grid.x, pointer.grid.y, params.rip, 1); ci++;
  }
  wantRipple = false;
  for (const s of pending){ if (ci >= CLICKS) break; arr[ci].set(s.x, s.y, s.s, 1); ci++; }
  pending.length = 0;
  if (params.rain && ci < CLICKS){
    for (let i = 0; i < 3 && ci < CLICKS; i++){
      arr[ci].set(Math.random() * SIM, Math.random() * SIM, 0.55, 1); ci++;
    }
  }
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const _L = new THREE.Vector3();
const fpsEl = $('fps');
let frames = 0, fpsTime = 0, last = performance.now();

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  // fps meter
  frames++; fpsTime += dt;
  if (fpsTime >= 0.5){ fpsEl.textContent = Math.round(frames / fpsTime); frames = 0; fpsTime = 0; }

  // sun
  if (params.anim){
    sunTheta += dt * 0.35;
    const deg = ((sunTheta * 180 / Math.PI) % 360 + 360) % 360;
    sliders.az.inp.value = deg;
    sliders.az.val.textContent = deg.toFixed(0) + '°';
  }
  const el = params.el;
  _L.set(Math.cos(el) * Math.cos(sunTheta), Math.sin(el), Math.cos(el) * Math.sin(sunTheta)).normalize();
  waterMat.uniforms.uLightDir.value.copy(_L);
  waterMat.uniforms.uHeightScale.value = params.amp;
  waterMat.uniforms.uLightIntensity.value = params.li;

  // --- simulation step ---
  prepareClicks();
  simMat.uniforms.tState.value = readRT.texture;
  simMat.uniforms.uParams.value.set(params.speed, params.damp, 1.0);
  simMat.uniforms.uRadius.value = params.rad;
  renderer.setRenderTarget(writeRT);
  renderer.render(simScene, simCam);
  const tmp = readRT; readRT = writeRT; writeRT = tmp;   // swap

  waterMat.uniforms.uHeight.value = readRT.texture;

  // --- render scene ---
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------------------
// Resize + startup
// ---------------------------------------------------------------------------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// a few opening ripples so it isn't perfectly still
splash(SIM * 0.50, SIM * 0.50, 1.6);
splash(SIM * 0.30, SIM * 0.62, 1.2);
splash(SIM * 0.66, SIM * 0.40, 1.2);

// ---------------------------------------------------------------------------
// Test/debug hook — read back the live heightfield energy (used by verify.mjs)
// ---------------------------------------------------------------------------
window.__simDebug = {
  params, SIM,
  _dec(h){ // IEEE754 half-float (raw 16-bit) -> float
    const s = (h & 0x8000) ? -1 : 1;
    const e = (h >>> 10) & 0x1f;
    const m = h & 0x3ff;
    if (e === 0) return s * m * 1.1920928955078125e-7;
    if (e === 31) return m ? NaN : s * Infinity;
    return s * (1 + m / 1024) * Math.pow(2, e - 15);
  },
  _read(channel){
    const px = new Uint16Array(SIM * SIM * 4);
    renderer.setRenderTarget(readRT);
    gl.readPixels(0, 0, SIM, SIM, gl.RGBA, gl.HALF_FLOAT, px);
    renderer.setRenderTarget(null);
    let sum = 0, max = 0;
    for (let i = 0; i < SIM * SIM; i++){
      const v = Math.abs(this._dec(px[i * 4 + channel]));
      sum += v; if (v > max) max = v;
    }
    return { mean: sum / (SIM * SIM), max };
  },
  getEnergy(){ return this._read(0); },        // R = height
  getVelocityEnergy(){ return this._read(1); }, // G = velocity
};

console.log('Water sim ready — grid', SIM + 'x' + SIM, '| subdivisions', SEGMENTS + 'x' + SEGMENTS,
  '|', isGL2 ? 'WebGL2' : 'WebGL1');
</script>
